name: ML CI pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
    train-and-test:
      runs-on: ubuntu-latest
      steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install Libraries
        run: pip install -r requirement.txt

      - name: Train ML Model
        run: python train.py

      - name: ML Model Testing
        run: python test.py
      - name : Deployment
        if: success() && github.ref == 'refs/heads/main'
        env:
          Deploy_HOOK_URL: ${{secret.RENDER_DEPLOY_HOOK_URL}}
        run: curl--fail --silent --show-error "$Deploy_HOOK_URL"
